name: Databricks SQL validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install databricks-sql-connector "databricks-sdk>=0.72.0,<0.73.0" kaggle

      - name: Download Olist source data
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || {
            echo "::error::Add the KAGGLE_API_TOKEN repository secret before running this workflow."
            exit 1
          }
          mkdir -p data/raw
          kaggle datasets download -d olistbr/brazilian-ecommerce -p data/raw --unzip --force

      - name: Run pipeline on Databricks SQL warehouse
        env:
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG || 'main' }}
          DATABRICKS_SCHEMA: ${{ vars.DATABRICKS_SCHEMA || 'kpi' }}
          DATABRICKS_VOLUME: ${{ vars.DATABRICKS_VOLUME || 'raw' }}
        run: python scripts/run_databricks.py

      - name: Upload execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databricks-run-receipt
          path: docs/databricks-run-receipt.json
          if-no-files-found: ignore

      - name: Commit successful execution receipt
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/databricks-run-receipt.json
          if ! git diff --cached --quiet; then
            git commit -m "Record successful Databricks warehouse validation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
